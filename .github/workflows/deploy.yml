
name: Deploy SDG Assignment

on:
  push:
    branches:
      - main
    paths:
      - "sdg_assignment/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: sdg_assignment
        run: flutter pub get

      - name: Build SDG website
        working-directory: sdg_assignment
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: sdg_assignment/build/web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
